name: Main Validation
on:
  push:
    branches: [ 'main' ]
    paths: [ 'packer/**', 'examples/**', 'terraform/**', '.github/scripts/**', '.github/workflows/**', '.pre-commit.config.yaml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Framework Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.0'
          GITLEAKS_SHA256: '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' "${GITLEAKS_SHA256}" /tmp/gitleaks.tar.gz | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Perform Secrets Scan
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config "${{ github.workspace }}/.github/config/gitleaks.toml" \
            --redact \
            --verbose \
            --no-banner

      - name: Get Terraform version
        shell: bash
        run: |
          terraform_version="$(sed -n 's/^[[:space:]]*required_version = "\([^"]*\)".*/\1/p' "${{ github.workspace }}/terraform/versions.tf")"
          if [ -z "$terraform_version" ]; then
            echo "::error::Unable to parse Terraform version from terraform/versions.tf"
            exit 1
          fi
          echo "TERRAFORM_VERSION=$terraform_version" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "${{ env.TERRAFORM_VERSION }}"
          terraform_wrapper: false

      - name: Run terraform fmt (check)
        working-directory: "${{ github.workspace }}/terraform/"
        run: |
          terraform fmt -check -recursive .
          if [ $? -ne 0 ]; then
            echo "::error::Terraform files need formatting. Run: terraform fmt -recursive ./terraform"
            exit 1
          fi

      - name: Run terraform validate
        run: |
          if ! bash "${{ github.workspace }}/.github/scripts/validate_terraform.sh"; then
            echo "::error::Terraform files are invalid"
            exit 1
          fi

      - name: Get Packer version
        working-directory: "${{ github.workspace }}/packer/"
        shell: bash
        run: "bash ${{ github.workspace }}/.github/scripts/get_packer_version.sh"

      - name: Setup Packer
        uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232 # v3.1.0
        with:
          version: "${{ env.PACKER_VERSION }}"

      - name: Packer init
        working-directory: "${{ github.workspace }}/packer/"
        run: packer init .

      - name: Run packer fmt (check)
        working-directory: "${{ github.workspace }}/packer/"
        run: |
          packer fmt -check -recursive .
          if [ $? -ne 0 ]; then
            echo "::error::Packer files need formatting. Run: packer fmt -recursive ./packer"
            exit 1
          fi

      - name: Run packer validate
        working-directory: "${{ github.workspace }}/packer/"
        run: |
          if ! bash "${{ github.workspace }}/.github/scripts/validate_examples.sh"; then
            echo "::error::Packer files are invalid"
            exit 1
          fi
