name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          release-type: simple
          target-branch: main
          # One-shot pin: forces the next release PR to v0.0.1 rather than
          # release-please's first-release default of v1.0.0. The v1.0.0
          # contract lock is deferred until the consumer template repo and
          # ansible-framework integrations are fully validated end-to-end.
          # Remove this input in a follow-up after v0.0.1 is tagged so
          # release-please resumes default semver bumps from that baseline.
          release-as: 0.0.1
