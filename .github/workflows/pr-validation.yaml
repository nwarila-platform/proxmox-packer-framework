---
name: PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'packer/**'
      - 'examples/**'
      - 'contract/**'
      - 'tools/**'
      - 'docs/template-contract.md'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.pre-commit.config.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validation:
    name: Framework Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check reusable workflow contract
        run: python tools/check_reusable_workflow_contract.py

      - name: Install Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.0'
          GITLEAKS_SHA256: '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
          GITLEAKS_ASSET: >-
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "${GITLEAKS_ASSET}" \
            -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' "${GITLEAKS_SHA256}" /tmp/gitleaks.tar.gz | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Perform Secrets Scan
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config "${{ github.workspace }}/.github/config/gitleaks.toml" \
            --redact \
            --verbose \
            --no-banner

      - name: Get Packer version
        working-directory: "${{ github.workspace }}/packer/"
        shell: bash
        run: "bash ${{ github.workspace }}/.github/scripts/get_packer_version.sh"

      - name: Setup Packer
        uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232 # v3.1.0
        with:
          version: "${{ env.PACKER_VERSION }}"

      - name: Packer init
        working-directory: "${{ github.workspace }}/packer/"
        run: packer init .

      - name: Run packer fmt (check)
        working-directory: "${{ github.workspace }}/packer/"
        run: |
          packer fmt -check -recursive .
          if [ $? -ne 0 ]; then
            echo "::error::Packer files need formatting. Run: packer fmt -recursive ./packer"
            exit 1
          fi

      - name: Run packer validate
        working-directory: "${{ github.workspace }}/packer/"
        run: |
          if ! bash "${{ github.workspace }}/.github/scripts/validate_examples.sh"; then
            echo "::error::Packer files are invalid"
            exit 1
          fi
